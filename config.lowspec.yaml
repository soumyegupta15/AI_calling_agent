# =============================================================================
#  LOW-SPEC PROFILE -- for 2-4 physical cores
#
#    python scripts\download_models.py --llm-size 1.5b
#    pip install piper-tts
#    python scripts\download_models.py --only piper
#    python run_agent.py --config config.lowspec.yaml
#
#  What changed from config.yaml, and what it costs:
#
#    STT   moonshine/base -> tiny        ~4x faster, slightly worse on accents
#    TTT   Qwen2.5-3B     -> 1.5B        ~2x faster TTFT, less domain nuance
#    TTS   Kokoro         -> Piper       ~4x faster, noticeably more synthetic
#    VAD   longer silence hold           fewer false end-of-turns on a loaded CPU
#
#  Honest expectation: this gets a 2-core machine to roughly 1.5-2.5s to first
#  audio. The brief's ~1.2s target assumes 6-8 physical cores and is not
#  reachable here no matter how the knobs are set. If you need the real number,
#  the fix is hardware, not config.
# =============================================================================

paths:
  models_dir: models

audio:
  input_sample_rate: 16000
  output_sample_rate: 22050        # Piper voices are usually 22.05 kHz
  frame_samples: 512
  output_blocksize: 480
  input_device: null
  output_device: null

vad:
  model_file: silero_vad.onnx
  threshold: 0.5
  neg_threshold: 0.35
  # Longer than the default 400 ms. On a busy 2-core box the event loop jitters,
  # and cutting the caller off mid-sentence is worse than 100 ms of extra wait.
  min_silence_ms: 550
  min_speech_ms: 200
  speech_pad_ms: 200
  max_speech_ms: 20000

barge_in:
  enabled: true
  threshold: 0.70
  min_speech_ms: 180
  cooldown_ms: 150

stt:
  # ~60 MB instead of ~250 MB, and roughly 4x faster per pass.
  model_name: moonshine/tiny
  # Partials cost CPU that this machine does not have to spare, and they compete
  # with the LLM. Disabled: the final pass on tiny is quick enough.
  partial_interval_ms: 0
  reuse_stable_partial: false
  min_audio_ms: 250

llm:
  model_file: Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
  hf_repo: bartowski/Qwen2.5-1.5B-Instruct-GGUF
  hf_filename: Qwen2.5-1.5B-Instruct-Q4_K_M.gguf

  backend: server
  # The full system prompt is ~800 tokens; on 2 cores that is ~20s of prompt
  # ingest on any cache miss. The compact one is ~200 tokens and keeps the
  # persona, the 1-3 sentence rule, the no-markdown rule and the boundaries.
  system_prompt: compact
  server:
    binary: llama.cpp/llama-server.exe
    host: 127.0.0.1
    port: 8080
    auto_start: true
    startup_timeout_s: 180
    extra_args:
      - "--no-webui"

  # Smaller context = shorter prompt ingest = lower time-to-first-token, which is
  # the single biggest lever on a slow CPU.
  n_ctx: 1536
  n_batch: 128
  n_threads: null
  temperature: 0.65
  top_p: 0.9
  # Shorter replies. On a slow box a long answer means a long tail of stuttering
  # audio, so cap it harder than the 150 in the main profile.
  max_tokens: 90
  repeat_penalty: 1.1
  stop:
    - "\nUser:"
    - "\n["
    - "\nRiya:"
  history_token_budget: 700
  min_kept_turns: 2

tts:
  engine: piper
  # Downloaded by: python scripts\download_models.py --only piper
  model_file: en_US-amy-medium.onnx
  voices_file: en_US-amy-medium.onnx.json
  voice: amy
  speed: 1.0
  lang: en-us
  # Slightly larger first chunk than the main profile: Piper's per-call overhead
  # dominates, so very short chunks waste more time than they save.
  first_chunk_min_chars: 18
  chunk_min_chars: 55
  chunk_max_chars: 200

agent:
  name: Riya
  greeting: "Hi, this is Riya. How can I help?"
  show_metrics: true
  show_partials: false
